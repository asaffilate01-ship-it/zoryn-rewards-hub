name: Rewards Release Proof
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: rewards-release-proof-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:release
  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:release
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - if: always()
        run: supabase stop
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [application,browser,database]
    steps:
      - run: |
          if [[ "${{ needs.application.result }}" != "success" || "${{ needs.browser.result }}" != "success" || "${{ needs.database.result }}" != "success" ]]; then exit 1; fi
          echo "Rewards release-proof gates passed."
